<style>
/* ============================================================
  Setra — 健身训练记录 App
  深色健身风格 · 桌面优先 + 移动适配
   ============================================================ */
:root {
  --bg: #0b0f0d;
  --bg-2: #111714;
  --surface: #161d19;
  --surface-2: #1c2420;
  --surface-3: #232c27;
  --border: #2a342e;
  --border-2: #39443d;
  --text: #e8efe9;
  --text-2: #9fb0a6;
  --text-3: #5f6f66;
  --accent: #2dd27a;
  --accent-2: #4ade80;
  --accent-dim: rgba(45, 210, 122, .12);
  --danger: #ff5d5d;
  --danger-dim: rgba(255, 93, 93, .12);
  --warn: #ffb020;
  --warn-dim: rgba(255, 176, 32, .12);
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --topbar-h: 60px;
  --sidebar-w: 210px;
  --font-num: 'SF Mono', 'Roboto Mono', 'Consolas', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ---------- 布局骨架 ---------- */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}
#topbar {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: rgba(11, 15, 13, .92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  z-index: 30;
  flex-shrink: 0;
}
#sidebar {
  position: fixed;
  top: var(--topbar-h);
  left: 0;
  bottom: 0;
  width: var(--sidebar-w);
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  padding: 20px 12px;
  display: flex;
  flex-direction: column;
  z-index: 20;
}
.side-foot {
  margin-top: auto;
  font-size: 11px;
  color: var(--text-3);
  padding: 12px 8px;
  line-height: 1.6;
}
#main {
  margin-left: var(--sidebar-w);
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px 40px;
  height: calc(100vh - var(--topbar-h));
  height: calc(100dvh - var(--topbar-h));
}
#bottom-nav { display: none; }

/* ---------- 视图切换 ---------- */
.view { display: none; animation: fadeIn .22s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- 顶部栏 ---------- */
.topbar-left { display: flex; align-items: center; gap: 10px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: .3px; }
.logo-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #06240f; display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800;
}
.topbar-right { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px; border: none;
  background: var(--surface-2); color: var(--text);
  font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: .15s;
}
.icon-btn:hover { background: var(--surface-3); }
.total-timer { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.total-timer-label { font-size: 10px; color: var(--text-3); letter-spacing: 1px; text-transform: uppercase; }
.total-timer-value {
  font-family: var(--font-num); font-size: 22px; font-weight: 700;
  color: var(--accent); font-variant-numeric: tabular-nums;
}
.total-timer-value.paused { color: var(--warn); }

/* ---------- 侧边导航 ---------- */
.side-nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 12px 14px; border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--text-2); font-size: 15px; cursor: pointer;
  text-align: left; transition: .15s;
}
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
.nav-ico { font-size: 16px; width: 20px; text-align: center; }

/* ---------- 按钮 ---------- */
.btn {
  border: none; border-radius: var(--radius-sm); cursor: pointer;
  font-size: 14px; font-weight: 600; padding: 10px 18px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: .15s; white-space: nowrap;
}
.btn.primary { background: var(--surface-3); color: var(--text); }
.btn.primary:hover { background: #2c3730; }
.btn.accent { background: var(--accent); color: #06240f; }
.btn.accent:hover { background: var(--accent-2); }
.btn.danger { background: var(--surface-3); color: var(--danger); }
.btn.danger:hover { background: var(--danger-dim); }
.btn.ghost { background: transparent; border: 1px solid var(--border-2); color: var(--text-2); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn.small { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn.big { padding: 16px 22px; font-size: 16px; border-radius: 14px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }

/* ---------- 视图标题 ---------- */
.view-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.view-title { font-size: 24px; font-weight: 800; letter-spacing: .3px; }

/* ---------- 计划列表 ---------- */
.plan-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.plan-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; cursor: pointer; transition: .18s; position: relative;
  display: flex; flex-direction: column; gap: 14px;
}
.plan-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.pc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.plan-card .pc-name { font-size: 20px; font-weight: 700; line-height: 1.3; }
.plan-card .pc-goal {
  flex-shrink: 0; font-size: 12px; color: var(--accent); background: var(--accent-dim);
  padding: 3px 10px; border-radius: 999px; margin-top: 3px;
}
.pc-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.pc-stat {
  font-family: var(--font-num); font-size: 12px; color: var(--text-2);
  background: var(--surface-2); border: 1px solid var(--border-2);
  padding: 6px 10px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px;
}
.pc-stat b { color: var(--text-1); font-size: 14px; }
.pc-stat .stat-ico { color: var(--accent); font-style: normal; opacity: .8; }
.pc-last { font-size: 12px; color: var(--text-3); }
.pc-last span { color: var(--text-2); }
.pc-buttons { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 2px; }
.pc-buttons .btn.big { flex: 1; }
.pc-icon {
  width: 40px; height: 40px; padding: 0; flex-shrink: 0; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center;
}
.mini-btn {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-2);
  background: var(--surface-2); color: var(--text-2); cursor: pointer; font-size: 14px;
}
.mini-btn:hover { color: var(--accent); border-color: var(--accent); }
.mini-btn.danger:hover { color: var(--danger); border-color: var(--danger); }
.empty-state {
  text-align: center; padding: 80px 20px; color: var(--text-3);
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.empty-ico { font-size: 52px; opacity: .5; }

/* ---------- 计划编辑器 ---------- */
.editor-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.editor-name {
  flex: 1; min-width: 240px; font-size: 24px; font-weight: 800; padding: 8px 12px;
  background: transparent; border: none; border-bottom: 2px solid var(--border);
  color: var(--text); outline: none; transition: .15s;
}
.editor-name:focus { border-color: var(--accent); }
.editor-head-actions { display: flex; gap: 10px; }
.editor-sub { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-3); }
.field.grow { flex: 1; min-width: 180px; }
.field input, .field select, .field textarea {
  background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--radius-sm);
  color: var(--text); padding: 8px 12px; font-size: 14px; outline: none; transition: .15s;
  min-width: 130px;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 40px; }

/* 单位设置（编辑器顶部） */
.editor-units {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
  padding: 10px 14px; margin-bottom: 16px;
}
.editor-units .eu-title { font-size: 12px; color: var(--text-3); font-weight: 600; margin-right: 2px; }
.editor-units .field { flex-direction: row; align-items: center; gap: 8px; }
.editor-units .field select { min-width: 0; width: auto; padding: 6px 10px; font-size: 13px; }

/* 动作卡片（收缩 / 展开） */
.exercise-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 14px; overflow: hidden; transition: border-color .18s, box-shadow .18s;
}
.exercise-card:hover { border-color: var(--border-2); }
.exercise-card.expanded { border-color: var(--accent); box-shadow: var(--shadow); }

/* 标题栏：两行布局 - 第一行 拖拽把手+图标+动作名+组数；第二行 组信息单行横排 */
.ex-titlebar {
  position: relative;
  display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 14px;
  background: var(--surface-2); cursor: pointer; user-select: none; -webkit-user-select: none;
}
.exercise-card.expanded .ex-titlebar { background: var(--surface); border-bottom: 1px solid var(--border); }
.ex-drag {
  position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
  cursor: grab; color: var(--text-3); font-size: 16px; line-height: 1; z-index: 2;
}
.ex-drag:active { cursor: grabbing; }
/* 第一行：图标 + 动作名 + 组数徽章 */
.ex-head {
  display: flex; align-items: center; gap: 10px; min-width: 0;
  padding-left: 18px; /* 给拖拽把手留位 */
}
/* 哑铃图标 */
.ex-icon {
  flex-shrink: 0; width: 32px; height: 32px; border-radius: 9px;
  background: var(--accent-dim); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.ex-icon svg { width: 20px; height: 20px; }
.ex-name-text {
  flex: 1; min-width: 0;
  font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: .2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ex-count {
  flex-shrink: 0; font-size: 11.5px; font-weight: 700; color: var(--accent);
  background: var(--accent-dim); border-radius: 20px; padding: 2px 10px;
  font-family: var(--font-num); letter-spacing: .3px;
}
/* 第二行：组信息单行横排 */
.ex-sum-rows {
  display: flex; align-items: center; gap: 0;
  overflow-x: auto; overflow-y: hidden; padding-left: 18px;
  scrollbar-width: none; min-height: 24px;
}
.ex-sum-rows::-webkit-scrollbar { display: none; }
.exercise-card.expanded .ex-sum-rows { display: none; }
.ex-sum-cell {
  flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 6px;
  padding: 0 8px; white-space: nowrap; overflow: hidden;
}
.ex-sum-no {
  flex-shrink: 0; width: 19px; height: 19px; border-radius: 50%;
  background: var(--accent); color: var(--surface);
  font-size: 11.5px; font-weight: 700; font-family: var(--font-num);
  display: flex; align-items: center; justify-content: center; line-height: 1;
}
.ex-sum-main {
  display: flex; align-items: baseline; gap: 3px; min-width: 0;
  font-size: 13px; color: var(--text); font-family: var(--font-num);
  overflow: hidden;
}
.ex-sum-main b { font-weight: 800; color: var(--text); }
.ex-x { color: var(--text-3); font-weight: 400; }
.ex-sum-sep {
  flex-shrink: 0; width: 1px; align-self: stretch; margin: 5px 2px; background: var(--border);
}
.ex-sum-time {
  display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text-3);
  font-family: var(--font-num); flex-shrink: 0;
}
.ex-sum-time svg { flex-shrink: 0; opacity: .7; }
.ex-toggle {
  position: absolute; right: 10px; top: 12px;
  flex-shrink: 0; width: 28px; height: 28px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .2s, color .2s, border-color .2s;
}
.ex-toggle:hover { background: var(--surface-2); color: var(--accent); border-color: var(--accent); }
.exercise-card.expanded .ex-toggle { transform: rotate(180deg); }

/* 展开体：grid-rows 实现平滑收起动画 */
.ex-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s ease; }
.exercise-card.expanded .ex-body { grid-template-rows: 1fr; }
.ex-body-inner { overflow: hidden; min-height: 0; }

/* 展开态顶部的编辑区：动作名 / 类别 / 备注 / 操作按钮 */
.ex-head-edit {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 14px 16px 4px; border-bottom: 1px dashed var(--border);
}
.ex-name-input, .ex-cat-input, .ex-note-input {
  background: transparent; border: none; border-bottom: 1px solid transparent;
  color: var(--text); font-size: 16px; font-weight: 700; outline: none; padding: 2px 4px; width: 100%;
}
.ex-name-input { flex: 1; min-width: 140px; }
.ex-name-input:focus { border-color: var(--accent); }
.ex-cat-note { display: flex; gap: 10px; flex: 1 1 100%; }
.ex-cat-input { font-size: 12px; font-weight: 400; color: var(--text-2); width: 130px; }
.ex-note-input { font-size: 12px; font-weight: 400; color: var(--text-3); flex: 1; }
.ex-actions { display: flex; gap: 6px; margin-left: auto; }

/* 每组区块 */
.sets-list { padding: 12px 16px 6px; display: flex; flex-direction: column; gap: 12px; }
.set-block {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px;
}
.set-block.dragging { opacity: .4; }
.sb-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.sb-drag { cursor: grab; color: var(--text-3); font-size: 16px; }
.sb-drag:active { cursor: grabbing; }
.sb-num { font-size: 14px; font-weight: 700; color: var(--accent); }
.sb-actions { margin-left: auto; display: flex; gap: 6px; }
.sb-fields { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.sb-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sb-field > span { font-size: 11px; color: var(--text-2); }
.sb-in {
  display: flex; align-items: center; gap: 6px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; transition: .15s;
}
.sb-in:focus-within { border-color: var(--accent); }
.sb-in input {
  background: transparent; border: none; color: var(--text); font-size: 16px; outline: none;
  width: 100%; min-width: 0; font-variant-numeric: tabular-nums; font-family: var(--font-num);
}
.sb-in b { font-size: 12px; color: var(--text-3); font-weight: 600; flex-shrink: 0; }
.sb-in select {
  border: none; background: transparent; color: var(--accent); font-size: 12px; font-weight: 700;
  outline: none; flex-shrink: 0; cursor: pointer; appearance: none; -webkit-appearance: none;
  text-align: center; padding: 0 2px; border-left: 1px solid var(--border);
  font-family: inherit;
}
.sb-in select option { background: var(--surface); color: var(--text); }

.ex-foot { padding: 12px 16px 16px; display: flex; gap: 10px; align-items: center; }
.ex-add-set { font-size: 13px; color: var(--accent); }
.ex-group-note { margin-left: auto; font-size: 11px; color: var(--text-3); }
/* 弹窗/历史中使用的内联组表格输入（编辑器内已改为组区块） */
.set-row { display: grid; gap: 8px; align-items: center; margin-bottom: 8px; }
.set-input {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); padding: 8px 10px; font-size: 14px; outline: none; width: 100%;
  font-variant-numeric: tabular-nums; text-align: center;
}
.set-input:focus { border-color: var(--accent); }
.set-num { font-family: var(--font-num); color: var(--text-2); font-size: 14px; font-weight: 600; }

/* 编辑器预计总时间汇总条 */
.editor-summary {
  background: linear-gradient(135deg, var(--accent-dim), transparent);
  border: 1px solid var(--accent); border-radius: var(--radius);
  padding: 14px 18px; margin-top: 4px;
}
.editor-summary .es-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.editor-summary .es-label { font-size: 12px; color: var(--text-2); }
.editor-summary .es-value {
  font-family: var(--font-num); font-size: 26px; font-weight: 700; color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.editor-summary .es-detail { font-size: 12px; color: var(--text-3); }
.editor-summary .es-warn {
  margin-top: 8px; padding: 10px 12px; border-radius: 8px;
  background: var(--warn-dim); border: 1px solid var(--warn);
  font-size: 13px; color: var(--text);
}
.editor-summary .es-warn .warn-amt { color: var(--danger); }

/* ---------- 训练界面 ---------- */
.view.workout { padding: 0; }
#workout-screen {
  min-height: calc(100vh - var(--topbar-h) - 40px);
  min-height: calc(100dvh - var(--topbar-h) - 40px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; text-align: center; position: relative;
}
.wo-status { font-size: 14px; color: var(--text-2); text-transform: uppercase; letter-spacing: 1.5px; }
.wo-exercise-name { font-size: 32px; font-weight: 800; margin: 4px 0; }
.wo-exercise-cat { font-size: 13px; color: var(--text-3); }
.wo-progress {
  font-family: var(--font-num); font-size: 15px; color: var(--text-3);
  background: var(--surface); border: 1px solid var(--border); padding: 6px 18px; border-radius: 20px;
}
/* 大计时器 */
.wo-timer-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.wo-timer-label { font-size: 12px; color: var(--text-3); letter-spacing: 1px; }
.wo-timer {
  font-family: var(--font-num); font-size: clamp(72px, 16vw, 130px); font-weight: 800;
  color: var(--text); line-height: 1; font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
}
.wo-timer.rest { color: var(--warn); }
.wo-timer.active-pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
/* 训练简洁小卡片（训练模式，区别于编辑模式的详细参数展示） */
.wo-card {
  background: var(--surface); border: 1px solid var(--border-2); border-radius: 22px;
  padding: 26px 22px; width: 100%; max-width: 420px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
}
.wo-card .wo-status { font-size: 12px; color: var(--text-3); letter-spacing: 1.5px; }
.wo-card .wo-status.paused { color: var(--warn); }
.wo-card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; }
.wo-ex-name { font-size: 21px; font-weight: 800; line-height: 1.3; text-align: left; }
.wo-set-count {
  font-family: var(--font-num); font-size: 13px; color: var(--accent);
  background: var(--accent-dim); border: 1px solid var(--accent);
  padding: 4px 12px; border-radius: 999px; flex-shrink: 0; white-space: nowrap;
}
.wo-ex-cat { font-size: 12px; color: var(--text-3); }
.wo-set-main {
  font-family: var(--font-num); font-size: clamp(40px, 13vw, 56px); font-weight: 800;
  color: var(--text); line-height: 1; margin: 4px 0; font-variant-numeric: tabular-nums;
}
.wo-timers { display: flex; gap: 14px; width: 100%; justify-content: center; }
.wo-timer-box {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  min-width: 104px; padding: 12px 16px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 14px;
}
.wo-timer-cur {
  font-family: var(--font-num); font-size: 30px; font-weight: 800; color: var(--text);
  font-variant-numeric: tabular-nums; line-height: 1;
}
.wo-timer-cur.active-pulse { animation: pulse 1.6s ease-in-out infinite; }
.wo-timer-target {
  font-family: var(--font-num); font-size: 30px; font-weight: 800; color: var(--accent);
  font-variant-numeric: tabular-nums; line-height: 1;
}
.wo-timer-label { font-size: 11px; color: var(--text-3); letter-spacing: .5px; }
.wo-card-progress { font-family: var(--font-num); font-size: 13px; color: var(--text-2); }
.wo-card-sub { display: flex; gap: 12px; width: 100%; justify-content: center; }
.wo-card-sub .wo-btn { flex: 1; max-width: 170px; }
.wo-card .wo-btn.done { width: 100%; max-width: 300px; }
/* 重量/次数大显示（保留给兼容场景） */
.wo-set-info { display: flex; gap: 26px; margin: 6px 0; }
.wo-set-item { display: flex; flex-direction: column; align-items: center; }
.wo-set-item .v { font-size: 30px; font-weight: 800; font-family: var(--font-num); }
.wo-set-item .l { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.wo-rest-remain {
  font-size: 20px; font-weight: 700; color: var(--warn);
  font-family: var(--font-num); margin-top: 4px;
}
/* 训练控制按钮 */
.wo-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.wo-btn {
  padding: 16px 26px; font-size: 16px; font-weight: 700; border-radius: 14px; border: none;
  cursor: pointer; transition: .15s;
}
.wo-btn.done { background: var(--accent); color: #06240f; }
.wo-btn.done:hover { background: var(--accent-2); transform: translateY(-1px); }
.wo-btn.pause { background: var(--surface-3); color: var(--text); }
.wo-btn.pause:hover { background: var(--border-2); }
.wo-btn.skip { background: var(--warn); color: #2a1a00; }
.wo-btn.skip:hover { background: #ffc24a; }
.wo-btn.stop { background: var(--danger-dim); color: var(--danger); border: 1px solid var(--danger); }
.wo-btn.stop:hover { background: var(--danger); color: #fff; }
.wo-btn:disabled { opacity: .4; cursor: not-allowed; }
.wo-edit-link { color: var(--text-3); font-size: 13px; text-decoration: underline; cursor: pointer; margin-top: 10px; }
.wo-edit-link:hover { color: var(--accent); }

/* 训练中的动作列表（底部） */
.wo-plan-preview { width: 100%; max-width: 720px; text-align: left; margin-top: 10px; }
.wo-plan-preview details { border-top: 1px solid var(--border); padding: 10px 0; }
.wo-plan-preview summary { cursor: pointer; color: var(--text-2); font-size: 14px; }
.wo-preview-ex { padding: 8px 0; border-bottom: 1px dashed var(--border); }
.wo-preview-ex .n { font-weight: 700; }
.wo-preview-ex .c { color: var(--text-3); font-size: 12px; }
.wo-preview-ex.done .n { color: var(--accent); }
.wo-preview-ex.cur .n { color: var(--accent); }

/* ---------- 历史列表 ---------- */
.history-list { display: flex; flex-direction: column; gap: 12px; max-width: 760px; }
.history-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; cursor: pointer; transition: .15s; display: flex; align-items: center; gap: 16px;
}
.history-card:hover { border-color: var(--accent); }
.hc-date { font-family: var(--font-num); color: var(--text-2); font-size: 14px; min-width: 84px; }
.hc-body { flex: 1; }
.hc-name { font-size: 17px; font-weight: 700; }
.hc-meta { font-size: 13px; color: var(--text-3); margin-top: 2px; }
.hc-actions { display: flex; gap: 6px; }
.hc-rate { font-family: var(--font-num); font-size: 15px; color: var(--accent); font-weight: 700; }

/* ---------- 历史详情 ---------- */
.detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; max-width: 760px; }
.detail-head { margin-bottom: 20px; }
.detail-date { font-family: var(--font-num); color: var(--accent); font-size: 16px; }
.detail-name { font-size: 26px; font-weight: 800; margin: 4px 0; }
.detail-total { font-size: 16px; color: var(--text-2); }
.detail-rate { margin-top: 12px; }
.detail-rate .bar {
  height: 10px; border-radius: 6px; background: var(--surface-3); overflow: hidden; margin-top: 6px;
}
.detail-rate .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 6px; transition: width .4s; }
.detail-rate .rate-label { font-size: 13px; color: var(--text-2); }
.detail-ex { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
.detail-ex .dex-name { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.detail-ex .dex-note { font-size: 12px; color: var(--text-3); margin-bottom: 6px; }
.dex-row { display: flex; align-items: center; gap: 12px; padding: 5px 0; font-family: var(--font-num); font-size: 14px; }
.dex-row .sn { color: var(--text-3); min-width: 44px; }
.dex-row .data { flex: 1; }
.dex-row .target { color: var(--text-3); font-size: 12px; }
.dex-row.done .data { color: var(--accent); }
.dex-row .time { color: var(--text-3); font-size: 12px; }
.detail-actions { margin-top: 22px; display: flex; gap: 10px; }

/* ---------- 设置 ---------- */
.settings-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; max-width: 640px; }
.settings-card h3 { font-size: 14px; color: var(--accent); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.setting-row:last-child { border-bottom: none; }
.setting-row select { background: var(--surface-2); border: 1px solid var(--border-2); color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 14px; }
.setting-row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
.settings-hint { font-size: 13px; color: var(--text-3); margin-bottom: 10px; }

/* ---------- Toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
  background: var(--surface-3); color: var(--text); padding: 12px 22px; border-radius: 30px;
  font-size: 14px; box-shadow: var(--shadow); z-index: 100; border: 1px solid var(--border-2);
  animation: toastIn .25s ease;
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%); } }

/* ---------- 模态框 ---------- */
#modal-root .overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 90;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: fadeIn .2s ease;
}
#modal-root .modal {
  background: var(--surface); border: 1px solid var(--border-2); border-radius: 16px;
  width: 100%; max-width: 480px; padding: 24px; box-shadow: var(--shadow);
}
#modal-root .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
#modal-root .modal-body { margin-bottom: 20px; }
#modal-root .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
#modal-root .field { margin-bottom: 14px; }
#modal-root .field input, #modal-root .field textarea { width: 100%; }

/* ---------- 休息全屏遮罩 ---------- */
.rest-overlay {
  position: fixed; inset: 0; background: rgba(20, 26, 22, .97); z-index: 80;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  text-align: center; padding: 24px; animation: fadeIn .25s ease;
}
.rest-overlay .rest-big { font-family: var(--font-num); font-size: clamp(90px, 22vw, 180px); font-weight: 800; color: var(--warn); line-height: 1; font-variant-numeric: tabular-nums; }
.rest-overlay .rest-title { font-size: 18px; color: var(--text-2); letter-spacing: 2px; text-transform: uppercase; }
.rest-overlay .rest-next { font-size: 15px; color: var(--text); max-width: 400px; }
.rest-overlay .rest-next b { color: var(--accent); }
.rest-overlay .rest-btn { background: var(--accent); color: #06240f; border: none; padding: 16px 40px; font-size: 18px; font-weight: 700; border-radius: 40px; cursor: pointer; margin-top: 8px; }
.rest-overlay .rest-btn:hover { background: var(--accent-2); }

/* 训练结束总结 */
.summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px; max-width: 560px; margin: 0 auto; text-align: center; }
.summary-rate { font-family: var(--font-num); font-size: 44px; font-weight: 800; color: var(--accent); }
.summary-bar { height: 12px; border-radius: 8px; background: var(--surface-3); overflow: hidden; margin: 16px 0; }
.summary-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.summary-meta { color: var(--text-2); font-size: 15px; line-height: 1.8; }
.summary-actions { display: flex; gap: 12px; justify-content: center; margin-top: 22px; }

/* ============================================================
   移动端适配
   ============================================================ */
@media (max-width: 780px) {
  #sidebar { display: none; }
  #main {
    margin-left: 0; padding: 16px 14px calc(76px);

  }
  #bottom-nav {

  .view-head { margin-bottom: 14px; }
  .view-title { font-size: 20px; }
  .plan-list { grid-template-columns: 1fr; }
  .pc-buttons { flex-wrap: wrap; }
  .pc-buttons .btn.big { min-width: 100%; }
  .pc-icon { flex: 1; width: auto; }
  .editor-head { flex-direction: column; align-items: stretch; gap: 12px; }
  .editor-head-actions { flex-wrap: wrap; }
  .editor-name { font-size: 20px; }
  .editor-sub { flex-direction: column; align-items: stretch; }
  .field, .field.grow { min-width: 0; }
  /* 组字段在移动端改为两列 */
  .sb-fields { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .sb-in input { font-size: 16px; }
  /* 动作卡片标题栏移动端适配（两行布局） */
  .ex-titlebar { gap: 8px; padding: 11px 10px 12px; }
  .ex-icon { width: 28px; height: 28px; }

  .ex-sum-no { width: 18px; height: 18px; font-size: 11px; }

  .ex-sum-time { font-size: 10.5px; }
  .ex-toggle { width: 30px; height: 30px; top: 11px; }
  /* 单位设置移动端 */
  .editor-units { gap: 10px; padding: 10px 12px; }
  .editor-units .field { flex: 1; min-width: 0; }
  .editor-units .field select { flex: 1; width: 100%; }
  .ex-head-edit { padding: 12px 12px 4px; }
  .ex-cat-note { gap: 8px; }
  .ex-cat-input { width: 100%; }
  .ex-actions { margin-left: 0; width: 100%; justify-content: flex-end; }
  .ex-actions .mini-btn { padding: 8px 12px; font-size: 15px; }
  .wo-timer { font-size: clamp(72px, 24vw, 120px); }
  .wo-btn { padding: 14px 18px; font-size: 15px; }
  .wo-actions { gap: 8px; }
  .history-card { flex-wrap: wrap; }
  .hc-rate { width: 100%; }
}

</style>

  Setra — 健身训练记录 App

(function () {

  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function fmtDur(sec) {
